<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guia Porto Saúde</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <script type="text/javascript">
        $(document).ready(function () {
            $('[data-toggle="tooltip"]').tooltip();
        });
    </script>
</head>

<body>
    <div class="container">
        <div class="table-wrapper">
            <div class="table-title">
                <div class="logo"><a href="index.html"><img src="logo.png" alt="Logo"></a></div>
            </div>
            
            <div class="table-filter">
                <div class="row" style="width: 100%;">
                    <!-- Elementos ocultos exigidos pelo script original para evitar erros -->
                    <div class="table-search" style="display:none;">
                        <span id="number1">1</span>
                        <span id="number2">5</span>
                        <select id="select-entries">
                            <option value="5">5</option>
                        </select>
                    </div>

                    <div class="container-fluid">
                        <div class="filter-group">
                            <div class="group" style="position: relative; max-width: 100%;">
                                <input type="text" placeholder="Pesquisar rua, equipe, posto..." class="form-control input" id="search" autofocus>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabela responsiva para celulares e computadores -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Rua</th>
                            <th>Equipe</th>
                            <th>Micro</th>
                            <th>Posto</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <!-- Os dados do script.js são injetados aqui -->
                    </tbody>
                </table>
            </div>

            <!-- Paginação original oculta mantida para compatibilidade com o script -->
            <div class="clearfix" style="display:none;">
                <ul id="subpage" class="pagination"></ul>
            </div>

        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
